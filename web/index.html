<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Café El Regio · Café colombiano y repostería artesanal</title>
    <meta
      name="description"
      content="Café El Regio: café colombiano, bebidas calientes y frías, métodos manuales y pedidos para eventos. Junto a KMuffis, repostería artesanal. Sitio en construcción."
    />
    <meta name="theme-color" content="#1c1511" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <!-- Formularios estáticos para detección de Netlify Forms en esta SPA. -->
    <form name="terms-acceptance" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="acceptanceId" />
      <input name="acceptedAt" />
      <input name="termsVersion" />
      <input name="context" />
      <input name="name" />
      <input name="contact" />
      <input name="termsAccepted" />
      <input name="privacyAccepted" />
      <input name="marketingAccepted" />
    </form>
    <form name="unsubscribe" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="email" type="email" />
      <input name="requestedAt" />
      <input name="scope" />
    </form>
    <form name="copyright-claim" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="work" />
      <input name="location" />
      <textarea name="claim"></textarea>
      <input name="submittedAt" />
      <input name="goodFaith" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
